name: Daily Outreach Pipeline

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y google-generativeai google || true
          pip install --upgrade "google-genai>=1.0.0"
          pip uninstall -y google-generativeai google || true
          pip install --upgrade "google-genai>=1.0.0"
          python -c "from google import genai; print('google-genai OK:', genai.__version__)"

      - name: Install Google Maps Scraper
        run: |
          LATEST=$(curl -s https://api.github.com/repos/gosom/google-maps-scraper/releases/latest | grep -oP '"tag_name": "\K[^"]+')
          echo "Latest version: $LATEST"
          ASSET_URL=$(curl -s https://api.github.com/repos/gosom/google-maps-scraper/releases/latest | grep -oP '"browser_download_url": "\K[^"]*linux-amd64[^"]*' | head -1)
          echo "Downloading: $ASSET_URL"
          wget -q "$ASSET_URL" -O gmaps-scraper
          chmod +x gmaps-scraper
          sudo mv gmaps-scraper /usr/local/bin/google-maps-scraper
          google-maps-scraper --help | head -5 || echo "binary installed"

      - name: Install Email Extractor
        run: |
          curl -sL https://raw.githubusercontent.com/kevincobain2000/email_extractor/master/install.sh | sudo bash
          sudo mv email_extractor /usr/local/bin/ 2>/dev/null || true
          which email_extractor || echo "WARN: email_extractor not found"

      - name: Run Day Agent (scrape + audit + draft)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ROUTER_KEY: ${{ secrets.AGENT_ROUTER_KEY }}
          MOCK_MODE: 'false'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
        run: python test_day_agent.py

      - name: Run Outreach Agent (send emails)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ROUTER_KEY: ${{ secrets.AGENT_ROUTER_KEY }}
          MOCK_MODE: 'true'
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
        run: python test_outreach.py

      - name: Run Reply Monitor (check inbox)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_ROUTER_KEY: ${{ secrets.AGENT_ROUTER_KEY }}
          MOCK_MODE: 'true'
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: python test_reply_monitor.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update leads data [skip ci]"
          git push